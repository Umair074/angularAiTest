<header class="header glass-panel">
  <div class="header-container">
    <!-- Logo -->
    <a href="#" class="logo" (click)="goToHome($event)">
      <svg class="logo-icon" viewBox="0 0 24 24" width="28" height="28">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" fill="none" stroke="url(#logoGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <defs>
          <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="var(--accent-indigo)" />
            <stop offset="100%" stop-color="var(--accent-purple)" />
          </linearGradient>
        </defs>
      </svg>
      <span class="logo-text">Umair<span class="dot">.</span>Dev</span>
    </a>

    <!-- Desktop Navigation -->
    <nav class="desktop-nav">
      <ul class="nav-links">
        <li>
          <a href="#home" [class.active]="currentSection() === 'home'" (click)="navigateToSection('home', $event)">Home</a>
        </li>
        <li>
          <a href="#skills" [class.active]="currentSection() === 'skills'" (click)="navigateToSection('skills', $event)">Skills</a>
        </li>
        <li>
          <a href="#projects" [class.active]="currentSection() === 'projects'" (click)="navigateToSection('projects', $event)">Projects</a>
        </li>
        <li>
          <a href="#contact" [class.active]="currentSection() === 'contact'" (click)="navigateToSection('contact', $event)">Contact</a>
        </li>
      </ul>
      <a href="#contact" class="btn btn-primary nav-btn" (click)="navigateToSection('contact', $event)">Hire Me</a>
    </nav>

    <!-- Mobile Menu Toggle -->
    <button class="mobile-toggle" (click)="toggleMobileMenu()" [class.open]="isMobileMenuOpen()" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <!-- Mobile Navigation Dropdown -->
  <div class="mobile-nav-wrapper" [class.open]="isMobileMenuOpen()">
    <nav class="mobile-nav">
      <ul class="mobile-nav-links">
        <li>
          <a href="#home" [class.active]="currentSection() === 'home'" (click)="navigateToSection('home', $event)">Home</a>
        </li>
        <li>
          <a href="#skills" [class.active]="currentSection() === 'skills'" (click)="navigateToSection('skills', $event)">Skills</a>
        </li>
        <li>
          <a href="#projects" [class.active]="currentSection() === 'projects'" (click)="navigateToSection('projects', $event)">Projects</a>
        </li>
        <li>
          <a href="#contact" [class.active]="currentSection() === 'contact'" (click)="navigateToSection('contact', $event)">Contact</a>
        </li>
        <li class="mobile-btn-li">
          <a href="#contact" class="btn btn-primary" (click)="navigateToSection('contact', $event)">Hire Me</a>
        </li>
      </ul>
    </nav>
  </div>
</header>
